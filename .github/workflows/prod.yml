name: Deploy to ECS

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: frontend-app-repo
  ECS_SERVICE: frontend-app-service
  ECS_CLUSTER: frontend-app-cluster
  ECS_TASK_DEFINITION: frontend-app-task-def
  CONTAINER_NAME: frontend-app

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: latest
      run: |
        docker build \
          --build-arg NODE_ENV=${{ env.NODE_ENV }} \
          --build-arg NEXT_TELEMETRY_DISABLED=${{ env.NEXT_TELEMETRY_DISABLED }} \
          --build-arg NEXTAUTH_URL=${{ env.NEXTAUTH_URL }} \
          --build-arg DJANGO_BACKEND=${{ env.DJANGO_BACKEND }} \
          --build-arg DJANGO_BACKEND_CLIENT_ID=${{ env.DJANGO_BACKEND_CLIENT_ID }} \
          --build-arg NEXTAUTH_SECRET=${{ env.NEXTAUTH_SECRET }} \
          --build-arg SA_GOOGLE_OAUTH2_KEY=${{ env.SA_GOOGLE_OAUTH2_KEY }} \
          --build-arg SA_GOOGLE_OAUTH2_SECRET=${{ env.SA_GOOGLE_OAUTH2_SECRET }} \
          --build-arg SA_FACEBOOK_LOGIN_KEY=${{ env.SA_FACEBOOK_LOGIN_KEY }} \
          --build-arg SA_FACEBOOK_LOGIN_SECRET=${{ env.SA_FACEBOOK_LOGIN_SECRET }} \
          --build-arg SA_TWITTER_API_V2_KEY=${{ env.SA_TWITTER_API_V2_KEY }} \
          --build-arg SA_TWITTER_API_V2_SECRET=${{ env.SA_TWITTER_API_V2_SECRET }} \
          --build-arg SA_INSTAGRAM_AUTH_KEY=${{ env.SA_INSTAGRAM_AUTH_KEY }} \
          --build-arg SA_INSTAGRAM_AUTH_SECRET=${{ env.SA_INSTAGRAM_AUTH_SECRET }} \
          -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Force new deployment
      run: |
        aws ecs update-service \
          --cluster ${{ env.ECS_CLUSTER }} \
          --service ${{ env.ECS_SERVICE }} \
          --force-new-deployment \
          --region ${{ env.AWS_REGION }}

    - name: Wait for deployment to complete
      run: |
        aws ecs wait services-stable \
          --cluster ${{ env.ECS_CLUSTER }} \
          --services ${{ env.ECS_SERVICE }} \
          --region ${{ env.AWS_REGION }}